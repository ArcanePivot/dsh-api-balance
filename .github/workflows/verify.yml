name: Verify patches

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify patches and compiled files
        run: bash ./scripts/verify-patches.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
            "install.ps1",
            "uninstall.ps1",
            "relaunch-dsh-web.ps1",
            "scripts/common.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
